<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Run Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Run Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#111;--mut:#5E5E5E;--line:#E2E2DE;--line2:#EEEEEA;--soft:#F5F5F3;--acc:#C2410C;--accsoft:#FFF4ED}
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(100px + env(safe-area-inset-bottom))}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}
h2{margin:0;font-size:15px;font-weight:600}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack.s8{gap:8px}.stack.s4{gap:4px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.row.c{align-items:center}
.sub{font-size:13px;color:var(--mut)}
.small{font-size:12px;color:var(--mut)}
.txt{font-size:14px;line-height:1.45;color:#333}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.soft{background:var(--soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--accsoft);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.4;color:#333}
.note svg{flex-shrink:0;margin-top:1px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.acc{color:var(--acc)}
.big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar>div{height:6px;background:var(--acc)}
.btn{display:flex;justify-content:center;align-items:center;min-height:50px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:inherit;font-size:16px;font-weight:600;width:100%;cursor:pointer;padding:0 14px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:40px;font-size:14px}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.link{background:none;border:none;font:inherit;font-size:14px;font-weight:600;color:var(--acc);padding:10px 0;cursor:pointer}
.link.mut{color:var(--mut);font-weight:500}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-height:40px;border:none;background:#fff;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;padding:0 4px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:19px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:48px;background:#fff;width:100%;-webkit-appearance:none;appearance:none}
input.lg{font-size:22px;font-weight:600;height:52px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
textarea{height:140px;padding:10px;font-size:12px;font-family:ui-monospace,monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-size:17px;font-weight:700}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:flex;gap:12px;padding:10px 14px;align-items:center;border-top:1px solid var(--line2);min-height:58px}
.li:first-child{border-top:none}
.li.hl{background:var(--accsoft)}
.day{width:36px;font-size:13px;color:var(--mut);flex-shrink:0}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t1{font-size:15px;font-weight:600}
.t2{font-size:12px;color:var(--mut)}
.strike{text-decoration:line-through;color:var(--mut);font-weight:400}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:4px}
.dot{width:34px;height:34px;border-radius:17px;margin:6px auto 0;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--soft)}
.dot.done{background:var(--ink);color:#fff;font-weight:600}
.dot.today{background:var(--acc);color:#fff;font-weight:600}
.dot.up{background:#fff;border:1.5px solid var(--ink)}
.dot.miss{background:#fff;border:1.5px dashed var(--acc);color:var(--acc);font-size:11px}
.eff{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.eff button{height:44px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);padding:0}
.eff button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.tbl .r{display:grid;grid-template-columns:1.3fr 1fr 1fr;font-size:14px;padding:9px 0;border-top:1px solid var(--line2);background:none;border-left:none;border-right:none;border-bottom:none;font-family:inherit;color:var(--ink);text-align:left;width:100%;cursor:pointer}
.tbl .r.on{font-weight:600}
.tbl .h{display:grid;grid-template-columns:1.3fr 1fr 1fr;font-size:12px;color:var(--mut);padding:2px 0}
.arrow{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.arrow:disabled{opacity:.35}
.wk{display:grid;grid-template-columns:1.2fr .8fr .8fr .8fr;gap:6px;align-items:center}
.wk input{height:44px;font-size:15px;padding:0 8px}
.phase{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.phase div i{display:block;height:6px;border-radius:3px;background:var(--line)}
.phase div.past i{background:var(--ink)}.phase div.on i{background:var(--acc)}
.phase div span{display:block;font-size:12px;color:var(--mut);margin-top:4px}
.phase div.on span{color:var(--ink);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.steps i{height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{height:48px;border:none;background:none;font:inherit;font-size:13px;color:var(--mut);cursor:pointer}
nav.tabs button.on{color:var(--ink);font-weight:700}
.err{color:var(--acc);font-size:13px}
svg text{font-family:Inter,system-ui,sans-serif}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden><div>
<button data-a="tab" data-v="today">Today</button>
<button data-a="tab" data-v="log">Log</button>
<button data-a="tab" data-v="progress">Progress</button>
<button data-a="tab" data-v="plan">Plan</button>
</div></nav>
<script>
/* ---------- storage ---------- */
const KEY='runplan.v1',APP_VERSION='1.2.0';
function blank(){return {settings:null,runs:[],history:[],bests:{},overrides:{}}}
function load(){try{const t=localStorage.getItem(KEY);if(t)return Object.assign(blank(),JSON.parse(t))}catch(e){}return blank()}
let S=load();
let FIXES=[];
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudPush()}
/* cloud sync: per-person private doc in the artifact's database */
const cloud={doc:null,state:'local',busy:false,again:false,timer:null};
function cloudPush(){if(!cloud.doc)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudWrite,600)}
async function cloudWrite(){
  if(!cloud.doc)return;if(cloud.busy){cloud.again=true;return}
  cloud.busy=true;
  try{await cloud.doc.set({json:JSON.stringify(S),updatedAt:S.updatedAt||Date.now()});cloud.state='synced'}
  catch(e){cloud.state=e&&e.code==='quota_exceeded'?'full':'error'}
  cloud.busy=false;if(cloud.again){cloud.again=false;cloudWrite()}
  refreshSync();
}
function sanitize(){
  FIXES=[];if(!S.settings)return;
  for(const k of Object.keys(S.bests||{})){const b=S.bests[k];if(b&&b.sec&&!okPace(b.sec/DIST[k])){FIXES.push(`Your ${DL[k]} best (${fmtT(b.sec)}) looked wrong, so I removed it. <button class="link" data-a="view" data-v="bests">Re-enter best times</button>`);delete S.bests[k]}}
  const g=S.settings.goal;if(g&&g.target&&!okPace(g.target/DIST[g.distance]))FIXES.push(`Your target (${fmtT(g.target)}) looks wrong. <button class="link" data-a="view" data-v="goal">Edit goal</button>`);
  if(!(S.settings.weeklyKm>0)&&S.history&&S.history.length){S.settings.weeklyKm=Math.round(mean(S.history.map(h=>+h.km||0)))}
  if(S.history&&S.history.length)S.history=[];
}
function adopt(d){try{const x=JSON.parse(d.json);if(x&&Array.isArray(x.runs)){S=Object.assign(blank(),x);sanitize();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}return true}}catch(e){}return false}
function refreshSync(){const el=document.getElementById('sync');if(el)el.textContent=syncText()}
function syncText(){return {synced:'Synced to your Claude account, so it works on any device you sign in on.',error:'Couldn\u2019t reach your account just now. Saved on this device; it will sync on your next change.',full:'Account storage is full. Export your data and remove old runs.',local:'Saved in this browser on this device. Export a copy now and then.',loading:'Connecting to your account\u2026'}[cloud.state]}
async function cloudInit(){
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use('db'),user=await window.claude.use('user');
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    cloud.state='loading';refreshSync();
    const ref=db.doc('data/users/'+id+'/state');
    const timer=setTimeout(()=>{if(cloud.state==='loading'){cloud.state='error';refreshSync()}},10000);
    const snap=await ref.get();clearTimeout(timer);
    cloud.doc=ref;
    const d=snap.exists?snap.data():null;
    if(d&&d.json&&(d.updatedAt||0)>(S.updatedAt||0)){if(adopt(d)){if(!S.settings||!S.settings.setupDone){ui.draft=null;ui.step=1}render()}cloud.state='synced'}
    else if(S.settings){await cloudWrite()}
    else cloud.state='synced';
    refreshSync();
    ref.onSnapshot(sn=>{if(sn.metadata.hasPendingWrites||!sn.exists)return;const x=sn.data();if(x&&x.json&&(x.updatedAt||0)>(S.updatedAt||0)&&!cloud.busy){if(adopt(x)&&!(ui.tab==='log'&&ui.form&&(ui.form.km||ui.form.time))&&!ui.view)render()}},()=>{});
  }catch(e){cloud.state=cloud.doc?'error':'local';refreshSync()}
}

/* ---------- dates & formatting ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>parseD(s).getDay();
const mondayOf=s=>addDays(s,-((dow(s)+6)%7));
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const dateOfDow=(ws,dw)=>addDays(ws,(dw+6)%7);
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYSL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate=s=>{const d=parseD(s);return DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const fmtDay=s=>{const d=parseD(s);return d.getDate()+' '+MON[d.getMonth()]};
const fmtMonth=s=>{const d=parseD(s.length===7?s+'-01':s);return MON[d.getMonth()]+' '+d.getFullYear()};
function fmtT(sec){if(sec==null||!isFinite(sec))return '—';sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+':'+pad(m)+':'+pad(s):m+':'+pad(s)}
function fmtPace(p){if(!p||!isFinite(p))return '—';p=Math.round(p);return Math.floor(p/60)+':'+pad(p%60)+'/km'}
function fmtDelta(sec){const s=Math.round(Math.abs(sec));return (sec<0?'−':'+')+(s>=60?fmtT(s):s+'s')}
function parseT(str){
  str=(str||'').trim();if(!str)return null;
  let h=0,m=0,sec=0;
  if(str.includes(':')){const p=str.split(':');if(p.length>3||p.some(x=>!/^\d+$/.test(x.trim())))return null;const n=p.map(Number);
    if(n.length===2){[m,sec]=n}else{[h,m,sec]=n;if(m>59)return null}}
  else{const d=str.replace(/\D/g,'');if(!d||d.length>6)return null;
    if(d.length<=2)m=+d;else if(d.length<=4){m=+d.slice(0,-2);sec=+d.slice(-2)}else{h=+d.slice(0,-4);m=+d.slice(-4,-2);sec=+d.slice(-2);if(m>59)return null}}
  if(sec>59)return null;const t=h*3600+m*60+sec;return t>0?t:null;
}
function fmtDigits(v){const d=String(v).replace(/\D/g,'').replace(/^0+(?=\d{3})/,'').slice(0,6);if(d.length<=2)return d;if(d.length<=4)return d.slice(0,-2)+':'+d.slice(-2);return d.slice(0,-4)+':'+d.slice(-4,-2)+':'+d.slice(-2)}
const PACE_MIN=150,PACE_MAX=900;
const okPace=p=>p>=PACE_MIN&&p<=PACE_MAX;
const km1=x=>{const v=Math.round(x*10)/10;return v%1?v.toFixed(1):String(v)};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

/* ---------- constants ---------- */
const DIST={'5k':5,'10k':10,'half':21.0975,'marathon':42.195};
const DL={'5k':'5k','10k':'10k','half':'Half','marathon':'Marathon'};
const MARGIN={'5k':1,'10k':1,'half':1.02,'marathon':1.05};
const MODES={light:{label:'Light',g:.02,runs:3,r:.004},relaxed:{label:'Relaxed',g:.04,runs:4,r:.007},medium:{label:'Medium',g:.07,runs:4,r:.01},fast:{label:'Fast',g:.10,runs:4,r:.013}};
const MODE_ORDER=['light','relaxed','medium','fast'];
const MAXKM={'5k':45,'10k':55,'half':65,'marathon':80};
const MAXLONG={'5k':12,'10k':16,'half':22,'marathon':32};
const STARTKM={'5k':15,'10k':20,'half':25,'marathon':30};
const MINKM={easy:3,long:5,tempo:4,intervals:4,trial:7,race:3};
const TITLE={easy:'Easy',long:'Long',tempo:'Tempo',intervals:'Intervals',trial:'Time trial',race:'Race'};
const TYPES=['easy','tempo','intervals','long','race'];
const TYPEL={easy:'Easy',tempo:'Tempo',intervals:'Intervals',long:'Long',race:'Race / trial'};
const HARD=t=>t==='intervals'||t==='tempo'||t==='trial'||t==='race';
const isLong=t=>t==='long';

/* ---------- fitness ---------- */
const riegel=(t,d1,d2)=>t*Math.pow(d2/d1,1.06);
const marginFor=km=>km>30?1.05:km>15?1.02:1;
function predict(k,e5){return e5==null?null:riegel(e5,5,DIST[k])*MARGIN[k]}
function estimate(asOf){
  let W=0,X=0,Wt=0,Xt=0;
  const add=(t5,w,date,tr)=>{const age=daysBetween(date,asOf);if(age<0||age>730)return;const ww=w*Math.pow(.5,age/120);if(tr){Wt+=ww;Xt+=ww*t5}else{W+=ww;X+=ww*t5}};
  for(const k in S.bests){const b=S.bests[k];if(b&&b.sec&&okPace(b.sec/DIST[k])){const d=b.date?(b.date.length===7?b.date+'-15':b.date):addDays(asOf,-200);add(riegel(b.sec/MARGIN[k],DIST[k],5),1,d)}}
  for(const r of S.runs){
    if(r.date>asOf||!(r.km>0)||!(r.sec>0)||!okPace(r.sec/r.km))continue;
    if(r.type==='race'){if(r.km>=3)add(riegel(r.sec/marginFor(r.km),r.km,5),1.2,r.date)}
    else if(r.effort>=5&&r.km>=3){const f=1+(10-r.effort)*.045;add(r.sec/r.km/f*5,r.type==='intervals'?.1:.25,r.date,true)}
  }
  if(Wt>0){const k=Math.min(Wt,1);W+=k;X+=k*Xt/Wt}
  return W>.05?X/W:null;
}
function bestFor(k){
  let best=null;const b=S.bests[k];if(b&&b.sec&&okPace(b.sec/DIST[k]))best={sec:b.sec,date:b.date};
  for(const r of S.runs){if(r.type==='race'&&r.sec>0&&okPace(r.sec/r.km)&&Math.abs(r.km-DIST[k])/DIST[k]<.03){const sec=r.sec*DIST[k]/r.km;if(!best||sec<best.sec)best={sec,date:r.date}}}
  return best;
}

/* ---------- plan engine ---------- */
function weekKm(ws){const we=addDays(ws,6);let k=0;for(const r of S.runs)if(r.date>=ws&&r.date<=we)k+=+r.km||0;return k}
function startLevel(){
  const st=S.settings,g=st.goal.distance,ks=[];
  if(st.weeklyKm>0)return clamp(st.weeklyKm,5,MAXKM[g]);
  for(let i=1;i<=6;i++)ks.push(weekKm(addDays(st.startWeek,-7*i)));
  let last=-1;for(let i=0;i<ks.length;i++)if(ks[i]>0)last=i;
  if(last<0)return STARTKM[g]*(st.mode==='light'?.8:1);
  const use=ks.slice(0,Math.min(last+1,4)),avg=mean(use),mx=Math.max(...use);
  let lvl=avg;if(use.some(k=>k<.6*mx))lvl*=.9;
  return clamp(lvl,5,MAXKM[g]);
}
function planMeta(){
  const st=S.settings,raceWs=st.goal.raceDate?mondayOf(st.goal.raceDate):null;
  const nWeeks=raceWs&&raceWs>=st.startWeek?daysBetween(st.startWeek,raceWs)/7+1:null;
  return {raceWs,nWeeks};
}
function phaseInfo(i,nWeeks){
  if(nWeeks==null)return {name:i<4?'Base':'Build',trial:i%6===5};
  const g=S.settings.goal.distance,taper=(g==='5k'||g==='10k')?1:2,last=nWeeks-1;
  if(i>last)return {name:'Done',trial:false};
  if(i===last)return {name:'Race',trial:false};
  if(i>=nWeeks-taper)return {name:'Taper',trial:false};
  if(i>=nWeeks-taper-3)return {name:'Peak',trial:false};
  const base=Math.max(2,Math.round(.3*(nWeeks-taper-3)));
  return {name:i<base?'Base':'Build',trial:i%6===5};
}
function sessionsFor(w,ov){
  const st=S.settings,mode=MODES[st.mode],goal=st.goal.distance;
  ov=ov||S.overrides[w.ws]||{};
  const shift=ov.shift!=null?ov.shift:(st.shift||0);
  let tpl;
  if(w.phase==='Race'){
    const rd=st.goal.raceDate;
    tpl=[{type:'easy',dw:1,km:Math.max(3,Math.round(w.full*.25*2)/2)},{type:'easy',dw:3,km:3,note:'+ 4×100m strides'},{type:'race',date:rd,km:DIST[goal]}];
    tpl.forEach(s=>{if(s.dw!=null)s.dw=(s.dw+shift)%7});
  }else{
    tpl=mode.runs===3
      ?[{type:w.idx%2?'tempo':'intervals',dw:1},{type:'easy',dw:3},{type:'long',dw:5}]
      :[{type:'intervals',dw:1},{type:'tempo',dw:3},{type:'easy',dw:5},{type:'long',dw:6}];
    tpl.forEach(s=>s.dw=(s.dw+shift)%7);
    if(w.trial){const h=tpl.find(s=>s.type==='tempo')||tpl.find(s=>HARD(s.type));h.type='trial'}
    const WT={long:1.6,tempo:1,intervals:.9,easy:1,trial:1};
    const tot=tpl.reduce((a,s)=>a+WT[s.type],0);
    tpl.forEach(s=>{let k=w.full*WT[s.type]/tot;if(s.type==='long')k=Math.min(k,MAXLONG[goal],w.full*.45);if(s.type==='trial')k=Math.max(7,k);s.km=Math.max(MINKM[s.type],Math.round(k*2)/2)});
  }
  const cnt={};tpl.forEach(s=>{cnt[s.type]=(cnt[s.type]||0)+1;s.id=w.ws+':'+s.type+':'+cnt[s.type]});
  // dropping
  const count=clamp(ov.count||tpl.length,2,tpl.length);
  if(count<tpl.length&&w.phase!=='Race'){
    const order=[];tpl.filter(s=>s.type==='easy').forEach(s=>order.push(s));
    const hards=tpl.filter(s=>s.type==='intervals'||s.type==='tempo');
    if(hards.length>1)order.push(w.idx%2?hards.find(s=>s.type==='intervals'):hards.find(s=>s.type==='tempo'));
    else if(hards.length===1&&tpl.some(s=>s.type==='trial'))order.push(hards[0]);
    order.slice(0,tpl.length-count).forEach(s=>s.dropped=true);
  }
  const moves=ov.moves||{};
  tpl.forEach(s=>{if(!s.date)s.date=dateOfDow(w.ws,moves[s.id]!=null?moves[s.id]:s.dw);else if(moves[s.id]!=null)s.date=dateOfDow(w.ws,moves[s.id]);s.moved=moves[s.id]!=null&&moves[s.id]!==s.dw});
  tpl.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return tpl;
}
function computePlan(){
  const st=S.settings,cur=mondayOf(today()),g=MODES[st.mode].g,goal=st.goal.distance;
  const {raceWs,nWeeks}=planMeta();
  let lastWs=addDays(cur,28);
  if(raceWs&&raceWs>=st.startWeek&&raceWs<lastWs)lastWs=raceWs;
  if(lastWs<cur)lastWs=cur;
  const weeks=[];let level=startLevel(),lows=0,before=level,reason='';
  for(let ws=st.startWeek,i=0;ws<=lastWs;ws=addDays(ws,7),i++){
    reason=i===0?'Starting close to what you have been running lately.':'';
    if(i>0){
      const p=weeks[i-1];
      if(p.ws<cur){
        const a=p.actual,t=p.evalTarget;
        if(t>0&&a<.7*t){
          if(!lows)before=level;lows++;
          level=before*(lows===1?1:lows===2?.8:.65);
          reason=lows===1?`Last week was ${km1(a)} of ${km1(t)} km, so this week repeats instead of progressing.`:lows===2?'Two low weeks in a row, so this week steps back to about 80%.':`${lows} low weeks in a row, so the plan steps back and rebuilds gradually.`;
        }else{
          const back=lows>0;lows=0;
          const partial=p.evalTarget<p.target*.95,eff=partial?level:p.recovery?a/.75:a,over=t>0&&a>1.2*t,gr=over?g/2:g,prev=level;
          level=Math.min(level,Math.max(eff,level*.9))*(1+gr);
          reason=over?'You ran well over plan last week, so this week’s increase is halved.':p.recovery?'Back to building after the recovery week.':back?'Solid week, so the plan is progressing again.':eff<prev*.97?'Last week came in a little short, so this week builds from what you actually ran.':`On track: weekly distance up ${Math.round(gr*100)}%.`;
        }
      }else{level=level*(1+g);reason='Draft: assumes the week before goes to plan.'}
    }
    level=clamp(level,5,MAXKM[goal]);
    const ph=phaseInfo(i,nWeeks);
    let full=level,recovery=false;
    if(ph.name==='Taper'||ph.name==='Race'){const fe=nWeeks-1-i;full=level*(fe===0?.55:fe===1?.7:.85)}
    else if(i%4===3&&lows===0&&ph.name!=='Done'){full=level*.75;recovery=true}
    const w={ws,idx:i,full,recovery,phase:ph.name,trial:ph.trial,lows,reason};
    if(recovery&&ws>=cur)w.reason='Recovery week: lighter on purpose so your body absorbs the training.';
    w.sessions=sessionsFor(w);
    w.target=w.sessions.filter(s=>!s.dropped).reduce((a,s)=>a+s.km,0);
    w.evalTarget=w.sessions.filter(s=>!s.dropped&&s.date>=st.startDate).reduce((a,s)=>a+s.km,0);
    w.actual=weekKm(ws);
    weeks.push(w);
  }
  return {weeks,nWeeks,raceWs,cur};
}
function runFor(s){return S.runs.find(r=>r.planned===s.id)}
function status(s){
  const r=runFor(s);if(r)return 'done';
  if(s.dropped)return 'dropped';
  if(s.date<S.settings.startDate)return 'pre';
  const t=today();return s.date<t?'missed':s.date===t?'today':'upcoming';
}
function paceFor(type,p5,goal){
  if(!p5)return null;
  return {easy:[p5*1.25,p5*1.32],long:[p5*1.27],tempo:[p5*1.08],intervals:[p5*.98],trial:[p5],race:[predict(goal,p5*5)/DIST[goal]]}[type];
}
function detail(s,p5){
  const goal=S.settings.goal.distance,P=paceFor(s.type,p5,goal);
  switch(s.type){
    case 'easy':return (P?`Easy @ ${fmtPace(P[0]).replace('/km','')}–${fmtPace(P[1])}`:'Easy, conversational pace')+(s.note?' '+s.note:'');
    case 'long':return (P?`Easy @ ~${fmtPace(P[0])}`:'Easy, steady effort')+((goal==='half'||goal==='marathon')?' · last 2 km steady':'');
    case 'tempo':{const tk=clamp(Math.round(s.km*.45),2,goal==='marathon'?12:8);return `${tk} km @ ${P?fmtPace(P[0]):'comfortably hard (effort 7)'} · rest easy`}
    case 'intervals':{const rep=(goal==='half'||goal==='marathon')?1000:800,reps=clamp(Math.round((s.km-3.5)/(rep===800?1.2:1.4)),4,10);return `${reps}×${rep}m @ ${P?fmtPace(P[0]):'hard (effort 8)'} · ${rep/2}m jog · track`}
    case 'trial':return '5k flat out · 2 km warm-up, 1 km cool-down';
    case 'race':return `Goal race: ${DL[goal]} in ${fmtT(S.settings.goal.target)}`;
  }
}
function sessTitle(s){return s.type==='race'?`Race · ${DL[S.settings.goal.distance]}`:`${TITLE[s.type]} · ${km1(s.km)} km`}
function etaText(pred,T){
  const st=S.settings,r=MODES[st.mode].r,gl=DL[st.goal.distance];
  if(pred==null)return 'Log a run or add a best time to get a prediction.';
  if(pred<=T)return 'You’re at goal pace. Confirm it with a time trial or race.';
  const rd=st.goal.raceDate;
  if(rd&&rd>=today()){
    const left=daysBetween(today(),rd)/7,atRace=pred*Math.pow(1-r,left);
    return atRace<=T*1.003?`On track for race day (${fmtDate(rd)}).`:`Ambitious for ${fmtDate(rd)}. Realistic on the day: about ${fmtT(atRace)}.`;
  }
  const wks=Math.log(T/pred)/Math.log(1-r);
  if(wks>104)return 'Long-term goal: over 2 years at this pace. A higher mode or nearer target may suit.';
  return `On pace for ${gl} goal around ${fmtMonth(addDays(today(),Math.round(wks*7)))}.`;
}

function chart(pts,target){

  const vals=pts.filter(p=>p.v!=null).map(p=>p.v);if(target)vals.push(target);
  let mn=Math.min(...vals),mx=Math.max(...vals);const padv=Math.max((mx-mn)*.12,10);mn-=padv;mx+=padv;
  const x=i=>L+i*(W-L-R)/(pts.length-1),y=v=>Tp+(v-mn)/(mx-mn)*(H-Tp-B);
  const line=pts.map((p,i)=>p.v!=null?`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`:null).filter(Boolean).join(' ');
  const lastI=pts.length-1,last=pts[lastI].v;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Predicted time trend">`;
  if(target){const ty=y(target);s+=`<line x1="0" y1="${ty}" x2="${W}" y2="${ty}" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="4 4"/><text x="0" y="${ty-6}" font-size="11" fill="#C2410C">Target ${fmtT(target)}</text>`}
  s+=`<line x1="0" y1="${H-B+4}" x2="${W}" y2="${H-B+4}" stroke="#E2E2DE"/>`;
  s+=`<polyline points="${line}" fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{if(p.v!=null)s+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===lastI?4.5:2.5}" fill="#111"/>`});
  if(last!=null)s+=`<text x="${W-R}" y="${y(last)-10}" font-size="12" font-weight="600" text-anchor="end" fill="#111">${fmtT(last)}</text>`;
  s+=`<text x="${L}" y="${H-4}" font-size="11" fill="#5E5E5E">${fmtDay(pts[0].d)}</text><text x="${W-R}" y="${H-4}" font-size="11" fill="#5E5E5E" text-anchor="end">Now</text></svg>`;

}
function modeSuggestion(P){
  const st=S.settings,t=today(),i=MODE_ORDER.indexOf(st.mode);
  const e2=S.runs.filter(r=>r.effort&&r.type!=='race'&&daysBetween(r.date,t)<14&&r.date<=t).map(r=>r.effort);
  if(e2.length>=3&&mean(e2)>=7.5&&i>0)return {mode:MODE_ORDER[i-1],text:`Effort has averaged ${km1(mean(e2))} over two weeks.`};
  const past=P.weeks.filter(w=>w.ws<P.cur).slice(-2);
  if(past.length===2&&past.every(w=>w.sessions.filter(s=>!s.dropped).length<=2||w.sessions.filter(s=>status(s)==='done').length<=2)&&i>0)return {mode:MODE_ORDER[Math.max(0,i-1)],text:'You’ve managed two runs or fewer for two weeks.'};
  const p3=P.weeks.filter(w=>w.ws<P.cur).slice(-3);
  const e3=S.runs.filter(r=>r.effort&&r.type!=='race'&&daysBetween(r.date,t)<21&&r.date<=t).map(r=>r.effort);
  if(p3.length===3&&i<3&&e3.length>=6&&mean(e3)<=5&&p3.every(w=>w.sessions.every(s=>{const x=status(s);return x!=='missed'})))return {mode:MODE_ORDER[i+1],text:'Every run done and effort comfortable for three weeks.'};
  return null;
}

  editRun:v=>{const r=S.runs.find(x=>x.id===v);if(!r)return;go(()=>{ui.form={date:r.date,type:r.type,km:String(r.km),time:fmtT(r.sec),effort:r.effort||null,notes:r.notes||'',planned:r.planned,err:null,editing:r.id};ui.msg=null;ui.swap=null;ui.confirm=null})},
  cancelEdit:()=>go(()=>{ui.form=newForm();ui.msg=null}),
  delRun:v=>{if(ui.confirm!==v){ui.confirm=v;return render()}S.runs=S.runs.filter(r=>r.id!==v);ui.confirm=null;save();render()},
  pDist:v=>{ui.progDist=v;render()},
  mode:v=>{S.settings.mode=v;save();render()},
  adjust:v=>go(()=>{const cur=mondayOf(today()),ws=v==='next'?addDays(cur,7):cur,o=S.overrides[ws]||{};ui.adj={ws,count:o.count||null,shift:o.shift!=null?o.shift:null,moves:Object.assign({},o.moves||{})};ui.view='adjust'}),
  adjWeek:v=>{const cur=mondayOf(today()),ws=v==='next'?addDays(cur,7):cur,o=S.overrides[ws]||{};ui.adj={ws,count:o.count||null,shift:o.shift!=null?o.shift:null,moves:Object.assign({},o.moves||{})};render()},
  adjCount:v=>{ui.adj.count=+v;render()},
  mv:v=>{const [id,dir]=v.split('|'),P=computePlan(),w=P.weeks.find(x=>x.ws===ui.adj.ws);const ss=sessionsFor(w,{count:ui.adj.count,moves:ui.adj.moves,shift:ui.adj.shift}),s=ss.find(x=>x.id===id);if(!s)return;const di=clamp((dow(s.date)+6)%7+(+dir),0,6),nd=(di+1)%7;ui.adj.moves[id]=nd;if(s.dw!=null&&nd===s.dw)delete ui.adj.moves[id];render()},
  adjReset:()=>{ui.adj.count=null;ui.adj.moves={};ui.adj.shift=null;render()},
  adjShift:v=>{ui.adj.shift=(+v===(S.settings.shift||0))?null:+v;ui.adj.moves={};render()},
  setShift:v=>{S.settings.shift=+v;save();render()},
  adjApply:()=>go(()=>{const a=ui.adj,o={};if(a.count)o.count=a.count;if(a.shift!=null)o.shift=a.shift;if(Object.keys(a.moves).length)o.moves=a.moves;if(Object.keys(o).length)S.overrides[a.ws]=o;else delete S.overrides[a.ws];save();ui.view=null;ui.tab='plan'}),
  dDist:v=>{ui.draft.distance=v;render()},
  dMode:v=>{ui.draft.mode=v;render()},
  goalSave:()=>{const d=ui.draft,e=targetErr(d),sec=parseT(d.target);if(e){d.err=e;return render()}const wk=parseFloat(String(d.weeklyKm).replace(',','.'));if(!(wk>=0&&wk<=250)){d.err='Enter your weekly km, e.g. 20';return render()}S.settings.weeklyKm=wk;
    go(()=>{const cur=mondayOf(today());S.settings.goal={distance:d.distance,target:sec,raceDate:d.raceDate||null};S.settings.mode=d.mode;S.settings.startWeek=cur;S.settings.startDate=today();S.overrides={};save();ui.view=null;ui.tab='plan'})},
  setupNext:()=>{const d=ui.draft;d.err=null;if(ui.step===1){const e=targetErr(d);if(e){d.err=e;return render()}}if(ui.step===2){const k=parseFloat(String(d.weeklyKm).replace(',','.'));if(!(k>=0&&k<=250)){d.err='Enter your weekly km, e.g. 20';return render()}}go(()=>{ui.step++})},
  setupBack:()=>go(()=>{ui.step--}),
  setupDone:()=>{const d=ui.draft,rb=readBests(d.bests);if(rb.err){d.err=rb.err;return render()}
    go(()=>{const old=S.settings||{};S.settings={goal:{distance:d.distance,target:parseT(d.target),raceDate:d.raceDate||null},mode:d.mode,shift:old.shift||0,weeklyKm:parseFloat(String(d.weeklyKm).replace(',','.'))||0,startWeek:mondayOf(today()),startDate:today(),setupDone:true};
      S.history=[];S.overrides={};S.bests=rb.bests;FIXES=[];save();ui.draft=null;ui.redo=false;ui.tab='today'})},
  redoSetup:()=>{if(ui.confirm!=='redo'){ui.confirm='redo';return render()}go(()=>{ui.confirm=null;ui.redo=true;ui.step=1;ui.draft=newDraft()})},
  cancelRedo:()=>go(()=>{ui.redo=false;ui.draft=null}),
  bestsSave:()=>{const rb=readBests(ui.draft.bests);if(rb.err){ui.draft.err=rb.err;return render()}go(()=>{S.bests=rb.bests;save();ui.view=null})},
  copyExp:()=>{const ta=document.getElementById('exp');const txt=ta.value;const ok=()=>{ui.msg='copied';render()};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,()=>{ta.select();try{document.execCommand('copy');ok()}catch(e){}});else{ta.select();try{document.execCommand('copy');ok()}catch(e){}}},
  doImport:()=>{const txt=document.getElementById('imp').value;try{const d=JSON.parse(txt);if(!d||typeof d!=='object'||!Array.isArray(d.runs))throw 0;S=Object.assign(blank(),d);save();go(()=>{ui.view=null;ui.msg=null;ui.tab='today'})}catch(e){ui.msg='That doesn’t look like an export from this app.';render()}},
  reset:()=>{if(ui.confirm!=='reset'){ui.confirm='reset';return render()}S=blank();save();ui.confirm=null;ui.step=1;ui.draft=null;go(()=>{})},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;e.preventDefault();const f=A[b.dataset.a];if(f)f(b.dataset.v,b)});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.time){const v=el.value;if(!v.includes(':')||/^\d*:?\d*:?\d*$/.test(v)){const f=fmtDigits(v);if(f!==v)el.value=f}}
  if(el.dataset.f&&ui.form){ui.form[el.dataset.f]=el.value;if(el.dataset.f==='km'||el.dataset.f==='time'){const p=document.getElementById('pace');if(p)p.textContent=livePace(ui.form)}}
  if(el.dataset.d&&ui.draft)ui.draft[el.dataset.d]=el.value;
  if(el.dataset.w&&ui.draft){const [i,k]=el.dataset.w.split('|');ui.draft.weeks[+i][k]=el.value}
  if(el.dataset.b&&ui.draft){const [k,f]=el.dataset.b.split('|');ui.draft.bests[k][f]=el.value}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.f==='date'&&ui.form){ui.form.date=el.value;ui.form.planned=el.value?defaultPlanned(el.value):null;if(ui.form.planned){const s=findSession(ui.form.planned);if(s)ui.form.type=s.type==='trial'?'race':s.type}render()}
  if(el.dataset.f==='planned'&&ui.form){ui.form.planned=el.value||null;if(el.value){const s=findSession(el.value);if(s)ui.form.type=s.type==='trial'?'race':s.type}render()}
});
sanitize();
render();
cloudInit();
</script>
</body>
